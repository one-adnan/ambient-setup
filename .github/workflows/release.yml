name: Release

# Push a tag like v1.0.0 to build the apps and publish a GitHub Release with them attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AmbientLightSync-Windows.exe
          - os: macos-latest
            asset: AmbientLightSync-macOS.zip
          - os: ubuntu-latest
            asset: AmbientLightSync-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller --onefile --windowed --name AmbientLightSync app.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/AmbientLightSync.exe "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent AmbientLightSync.app "../${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist AmbientLightSync

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Python version
        run: |
          mkdir AmbientLightSync-Python
          cp app.py ambient.py discover.py "Ambient Light.pyw" requirements.txt README.md AmbientLightSync-Python/
          zip -r AmbientLightSync-Python.zip AmbientLightSync-Python
      - uses: actions/upload-artifact@v4
        with:
          name: AmbientLightSync-Python.zip
          path: AmbientLightSync-Python.zip

  release:
    needs: [build, python-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: .github/release-notes.md
          generate_release_notes: true
